# CI for the BakersMath Android app.
#
# Runs the local quality gate (ktlint, Android Lint, unit tests, debug build)
# on every pull request and on pushes to `main`, and publishes the generated
# reports as artifacts so failures can be diagnosed without re-running locally.
name: Pull Request

on:
  # Validate every change proposed against the main branch.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Also validate the merged result landed on main.
  push:
    branches: [main]
  # Allow on-demand runs from the Actions UI.
  workflow_dispatch:

# A newer commit on the same ref makes older runs obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository at the triggering commit.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install the JDK the project's Gradle toolchain requires.
      #    JDK 25 (Temurin) is used on purpose: it matches
      #    `jvmToolchain(25)` in app/build.gradle.kts and avoids JDK 26,
      #    which breaks AGP's JdkImageTransform/jlink. `cache: gradle`
      #    wires up the wrapper cache.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # 3. Enable Gradle build/configuration caching and richer CI summaries.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Ensure the wrapper is executable on the checked-out tree.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 5. Run the full quality gate in a single invocation so the Gradle
      #    daemon is reused across tasks. `--stacktrace` keeps failures
      #    diagnosable; the daemon is intentionally left enabled because
      #    setup-gradle manages caching and lifecycle.
      - name: Run quality gate (ktlint, Android lint, unit tests, assemble)
        run: >
          ./gradlew
          ktlintCheck
          lintDebug
          testDebugUnitTest
          assembleDebug
          --stacktrace

      # 6. Always publish reports, even (especially) when the gate fails.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint and ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7
